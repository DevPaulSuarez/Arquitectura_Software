<header class="barra">
  <div class="barra-in">
    <div class="marca">
      <span class="marca-pt"></span>
      <span>VetCare</span>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-b activa" data-vista="hoy">Hoy</button>
      <button class="nav-b" data-vista="mapa">Mapa</button>
      <button class="nav-b" data-vista="repaso">Repaso<span class="pill" id="pillRepaso"></span></button>
      <button class="nav-b" data-vista="notas">Notas</button>
      <button class="nav-b" data-vista="glosario">Glosario</button>
    </nav>

    <div class="barra-acc">
      <span class="avance-txt" id="avanceTxt"></span>
      <button class="icono" id="btnTema" title="Cambiar tema">◐</button>

        <button class="icono" id="btnMas" title="Más opciones">···</button>
        <div class="menu" id="menu">
          <button id="btnExport">Guardar copia</button>
          <label class="menu-file">Restaurar copia<input type="file" id="inpImport" accept="application/json"></label>
          <button id="btnReset" class="peligro">Borrar mi progreso</button>
        </div>
      </div>
    </div>
  </div>
  <div class="avance"><div class="avance-fill" id="avanceFill"></div></div>
</header>

<main class="lienzo">
  <section class="vista activa" id="vistaHoy"></section>
  <section class="vista" id="vistaMapa"></section>
  <section class="vista" id="vistaRepaso"></section>
  <section class="vista" id="vistaNotas"></section>

</main>
